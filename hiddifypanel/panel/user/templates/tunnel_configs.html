<!DOCTYPE html>
<!-- watashi: tunnel configs page v12.2.59 -->
<html lang="{{ g.lang or 'en' }}" dir="{{ 'rtl' if (g.lang or 'en') in ['fa','ar'] else 'ltr' }}">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>WATASHI MANAGER</title>
	<style>
		:root { color-scheme: dark; }
		body { margin: 0; padding: 24px 16px; background: #0b0f19; color: #e5e7eb;
			font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
		.wrap { max-inline-size: 760px; margin-inline: auto; }
		h1 { font-size: 20px; margin: 0 0 4px; }
		.sub { color: #8b92a5; font-size: 13px; margin-block-end: 20px; }
		.card { background: #151a2a; border: 1px solid #2d3748; border-radius: 14px;
			padding: 16px; margin-block-end: 16px; }
		.head { display: flex; align-items: center; gap: 8px; margin-block-end: 12px; }
		.badge { background: #7c3aed; color: #fff; font-size: 11px; font-weight: 700;
			border-radius: 999px; padding: 3px 10px; }
		.name { color: #e5e7eb; font-size: 14px; overflow-wrap: anywhere; }
		.qr { background: #fff; padding: 10px; border-radius: 10px; inline-size: fit-content;
			margin-inline: auto; }
		.row { display: flex; gap: 8px; margin-block-start: 12px; }
		button { flex: 1; cursor: pointer; border: 1px solid #2d3748; border-radius: 10px;
			background: #0b0f19; color: #e5e7eb; padding: 10px 12px; font-size: 13px; }
		button:hover { border-color: #3b82f6; }
		.ok { border-color: #10b981; color: #10b981; }
		.empty { color: #f59e0b; font-size: 14px; }
		pre { background: #0b0f19; border: 1px solid #2d3748; border-radius: 10px;
			padding: 10px; font-size: 11px; color: #8b92a5; overflow-x: auto; margin: 12px 0 0; }
	</style>
</head>
<body>
<div class="wrap">
	<h1>WATASHI MANAGER <span style="color:#8b92a5;font-size:13px">シングル</span></h1>
	<div class="sub">WireGuard / AmneziaWG</div>

	{% if not items %}
		<div class="card empty">WireGuard / AmneziaWG: 0</div>
	{% endif %}

	{% for it in items %}
	<div class="card">
		<div class="head">
			<span class="badge">{{ it.app }}</span>
			<span class="name">{{ it.name }}</span>
		</div>
		<div class="qr" id="qr{{ loop.index }}"></div>
		<div class="row">
			<button type="button" data-dl="{{ loop.index0 }}">{{ _('Download') }}</button>
			<button type="button" data-copy="{{ loop.index0 }}">{{ _('Copy') }}</button>
		</div>
		<pre>{{ it.conf }}</pre>
	</div>
	{% endfor %}
</div>

<script src="{{ static_url_for(filename='js/qrcode.js') }}"></script>
<script>
	var ITEMS = {{ items|tojson }};
	ITEMS.forEach(function (it, i) {
		var host = document.getElementById('qr' + (i + 1));
		if (!host) { return; }
		new QRCode(host, { text: it.conf, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.L });
	});
	document.addEventListener('click', function (e) {
		var btn = e.target.closest('button');
		if (!btn) { return; }
		var dl = btn.getAttribute('data-dl');
		var cp = btn.getAttribute('data-copy');
		var it = ITEMS[dl !== null ? dl : cp];
		if (!it) { return; }
		if (dl !== null) {
			var url = URL.createObjectURL(new Blob([it.conf], { type: 'text/plain' }));
			var a = document.createElement('a');
			a.href = url; a.download = it.file;
			document.body.appendChild(a); a.click(); a.remove();
			setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
		} else if (navigator.clipboard) {
			navigator.clipboard.writeText(it.conf);
		}
		btn.classList.add('ok');
		setTimeout(function () { btn.classList.remove('ok'); }, 1200);
	});
</script>
</body>
</html>
